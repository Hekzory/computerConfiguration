# Managed by computerConfiguration: Codex
# User settings and credentials stay in ~/.codex; these system defaults remain overridable.
# The hooks enforce command policies and prepare optional Desktop browser access.

model_reasoning_effort = "high"
plan_mode_reasoning_effort = "high"

# Reuse Claude project guidance when there is no AGENTS.override.md or AGENTS.md.
project_doc_fallback_filenames = ["CLAUDE.md", "claude.md"]

# Linux fish accounts already fall back to Bash in Codex. Avoid profile startup
# (including profiles that exec fish), and don't capture a login-shell snapshot.
allow_login_shell = false

# Keep workspace writes sandboxed, with direct network access and user approvals.
sandbox_mode = "workspace-write"
approval_policy = "on-request"
approvals_reviewer = "user"

[sandbox_workspace_write]
network_access = true

[features]
hooks = true
shell_snapshot = false
memories = true

[memories]
version = "v2"
generate_memories = true
use_memories = true
extract_model = "gpt-6.1-sol"
consolidation_model = "gpt-6-astra"

[shell_environment_policy]
experimental_use_profile = false

[shell_environment_policy.set]
# SHELL is for child programs; it does not select Codex's own interpreter.
SHELL = "/usr/bin/bash"
BASH_ENV = "/dev/null"
PAGER = "cat"
GIT_PAGER = "cat"
SYSTEMD_PAGER = "cat"
MANPAGER = "col -bx"
GIT_TERMINAL_PROMPT = "0"

[tui]
status_line = ["model-with-reasoning", "context-used", "context-window-size", "current-dir", "weekly-limit", "git-branch"]

[[hooks.PreToolUse]]
matcher = "^Bash$"

[[hooks.PreToolUse.hooks]]
type = "command"
command = "/usr/bin/bash /etc/codex/hooks/git-guard.sh"
timeout = 10

[[hooks.PreToolUse.hooks]]
type = "command"
command = "/usr/bin/python3 /etc/codex/hooks/ssh-fish-guard.py"
timeout = 10

[[hooks.PreToolUse]]
matcher = "^mcp__cua_repl__js$"

[[hooks.PreToolUse.hooks]]
type = "command"
command = "/usr/bin/python3 /etc/codex/hooks/browser-connect.py"
timeout = 25
statusMessage = "Checking Desktop browser connection"
