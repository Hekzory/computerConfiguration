- name: Codex - configure private metrics export where an ingest token exists
  become: true
  become_user: "{{ the_user }}"
  ansible.builtin.command:
    cmd: >-
      /usr/bin/python3 /etc/codex/configure-telemetry.py
      --config {{ (user_home + '/.codex/config.toml') | quote }}
      {% for token_path in codex_otel_token_paths %}
      --token {{ token_path | quote }}
      {% endfor %}
      --endpoint {{ codex_otel_endpoint | quote }}
      --machine {{ codex_otel_machine | quote }}
      {{ '--check' if ansible_check_mode else '' }}
  register: codex_otel_result
  changed_when: codex_otel_result.stdout is search('^updated')
  when: not ansible_check_mode or codex_user_editor.stat.exists
  # The helper implements a read-only check and never prints the token.
  check_mode: false
  diff: false
