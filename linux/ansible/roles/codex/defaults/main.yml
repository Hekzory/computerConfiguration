# An existing personal Claude metrics token also opts this machine into Codex metrics.
# These are leaf-level updates, not a replacement for the user document. Keep
# credentials and generated runtime state out of these variables.
codex_user_config_updates:
  desktop:
    ambient-suggestions-enabled: false
  plugins:
    work-pets@openai-curated-remote:
      enabled: false
    pages@openai-curated-remote:
      enabled: false
    latex@openai-bundled:
      enabled: false
    code-review@openai-bundled:
      enabled: false
      mcp_servers:
        code-review:
          enabled: false
    codex-app-tools@openai-bundled:
      mcp_servers:
        codex_app:
          disabled_tools:
            - end_realtime_voice_call
            - share_thread
            - create_latex_project
            - compile_latex_document
  apps:
    connector_openai_hotline:
      enabled: false
    connector_openai_chatgpt_pets:
      enabled: false
    connector_openai_safety_settings:
      enabled: false
    connector_openai_pages:
      enabled: false
codex_user_disabled_skills:
  - work-pets:create-pet
  - work-pets:pets
  - work-pets:update-pet
  - pages:maintain-space
  - pages:manage-schedules
  - pages:organize-space
  - pages:write-page
codex_user_config_remove:
  - [features, analytics_plan_history]

codex_otel_endpoint: https://otel.tsv.one/v1/metrics
codex_otel_machine: "{{ ansible_facts['hostname'] ~ ('-wsl' if (is_wsl | default(false) | bool) else '') }}"
codex_otel_token_paths:
  - "{{ user_home }}/.codex/otel-token"
  - "{{ user_home }}/.claude/otel-token"
