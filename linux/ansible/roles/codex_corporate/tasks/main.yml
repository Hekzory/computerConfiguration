- name: Codex corporate - inspect private prerequisites before making changes
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: true
  loop: >-
    {{ [codex_corporate_mcc_guard_source,
        codex_corporate_context_source + '/work.md',
        codex_corporate_context_source + '/docs-researcher.md',
        user_home + '/.local/share/mcp-servers/node_modules/.bin/confluence-mcp-server',
        user_home + '/.config/confluence.token']
       + (codex_corporate_skill_names | map('regex_replace', '^', codex_corporate_skill_source + '/') | list) }}
  register: codex_corporate_prerequisites
  no_log: true

- name: Codex corporate - require private sources and preinstalled MCP runtime
  ansible.builtin.assert:
    that:
      - codex_corporate_prerequisites.results | map(attribute='stat.exists') | min
    quiet: true
    fail_msg: >-
      Provision the private skill/context sources, MCC guard, Confluence package
      and private token listed in roles/codex_corporate/README.md before applying.

- name: Codex corporate - create private user directories
  ansible.builtin.file:
    path: "{{ user_home }}/{{ item }}"
    state: directory
    owner: "{{ the_user }}"
    group: "{{ the_user }}"
    mode: '0700'
  loop:
    - .codex/mcp
    - .codex/hooks
    - .codex/agents
    - .codex/corporate
    - .agents/skills
    - .local/share/agent-context

- name: Codex corporate - inspect private asset destination directories
  ansible.builtin.stat:
    path: "{{ user_home }}/{{ item }}"
  loop:
    - .codex/corporate
    - .local/share/agent-context
  register: codex_corporate_private_directories

- name: Codex corporate - deploy portable adapters and research role
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ user_home }}/{{ item.dest }}"
    owner: "{{ the_user }}"
    group: "{{ the_user }}"
    mode: '0600'
  loop:
    - {src: confluence.py, dest: .codex/mcp/confluence.py}
    - {src: workspace-headers.py, dest: .codex/mcp/workspace-headers.py}
    - {src: mcc-guard.py, dest: .codex/hooks/mcc-guard.py}
    - {src: configure-hooks.py, dest: .codex/corporate/configure-hooks.py}
    - {src: docs-researcher.toml, dest: .codex/agents/docs-researcher.toml}
    - {src: work-context.py, dest: .local/share/agent-context/work-context.py}

- name: Codex corporate - deploy the private guard and context without logging content
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ user_home }}/{{ item.dest }}"
    remote_src: true
    owner: "{{ the_user }}"
    group: "{{ the_user }}"
    mode: '0600'
  loop:
    - {src: "{{ codex_corporate_mcc_guard_source }}", dest: .codex/corporate/mcc-guard.sh}
    - {src: "{{ codex_corporate_context_source }}/work.md", dest: .local/share/agent-context/work.md}
    - {src: "{{ codex_corporate_context_source }}/docs-researcher.md", dest: .local/share/agent-context/docs-researcher.md}
  diff: false
  no_log: true
  # remote_src copy fails in check mode if an earlier planned mkdir has not
  # actually happened. Prerequisites were validated before any changes.
  when: >-
    not ansible_check_mode or
    (item.dest is match('^.codex/corporate/') and codex_corporate_private_directories.results[0].stat.exists) or
    (item.dest is match('^.local/share/agent-context/') and codex_corporate_private_directories.results[1].stat.exists)

- name: Codex corporate - report private assets planned for a new directory
  ansible.builtin.debug:
    msg: Private corporate assets will be deployed after their directory is created.
  when: >-
    ansible_check_mode and
    not (codex_corporate_private_directories.results[0].stat.exists and
         codex_corporate_private_directories.results[1].stat.exists)
  changed_when: true

- name: Codex corporate - link private work skills without changing personal skills
  ansible.builtin.file:
    src: "{{ codex_corporate_skill_source }}/{{ item }}"
    dest: "{{ user_home }}/.agents/skills/{{ item }}"
    state: link
    owner: "{{ the_user }}"
    group: "{{ the_user }}"
  loop: "{{ codex_corporate_skill_names }}"

- name: Codex corporate - inspect installed user helpers
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - /etc/codex/configure-user.py
    - "{{ user_home }}/.codex/corporate/configure-hooks.py"
  register: codex_corporate_helpers

- name: Codex corporate - merge the reviewed MCP policies
  become: true
  become_user: "{{ the_user }}"
  ansible.builtin.command:
    argv: >-
      {{ ['/usr/bin/python3', '/etc/codex/configure-user.py',
          '--config', user_home + '/.codex/config.toml',
          '--updates-json', codex_corporate_mcp_policy | to_json]
         + (['--check'] if ansible_check_mode else []) }}
  register: codex_corporate_mcp_result
  changed_when: codex_corporate_mcp_result.stdout == 'updated'
  when: not ansible_check_mode or codex_corporate_helpers.results[0].stat.exists
  check_mode: false
  diff: false
  no_log: true

- name: Codex corporate - add selected handlers while preserving other user hooks
  become: true
  become_user: "{{ the_user }}"
  ansible.builtin.command:
    argv: >-
      {{ ['/usr/bin/python3', user_home + '/.codex/corporate/configure-hooks.py',
          '--config', user_home + '/.codex/hooks.json', '--home', user_home]
         + (['--check'] if ansible_check_mode else []) }}
  register: codex_corporate_hooks_result
  changed_when: codex_corporate_hooks_result.stdout == 'updated'
  when: not ansible_check_mode or codex_corporate_helpers.results[1].stat.exists
  check_mode: false
  diff: false
  no_log: true
