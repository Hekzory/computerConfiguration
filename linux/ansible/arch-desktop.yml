- name: Include arch-core.yml
  import_playbook: arch-core.yml

- name: Arch-desktop.yml - desktop setup for arch
  hosts: arch
  become: false
  vars:
    the_user: "{{ ansible_facts['user_id'] }}"
    user_home: "{{ ansible_facts['env'].HOME }}"
    is_wsl: "{{ 'microsoft' in (ansible_facts['kernel'] | lower) }}"

  handlers:
    - name: Rebuild font cache
      listen: fonts_changed
      ansible.builtin.command: fc-cache -f
      changed_when: true

  tasks:
    - name: Verify not running under WSL
      ansible.builtin.assert:
        that: not (is_wsl | bool)
        fail_msg: "This desktop playbook should not run under WSL"
        success_msg: "Bare-metal or VM confirmed"

    # Cleanup first
    - name: Remove unneeded packages if present
      become: true
      community.general.pacman:
        name:
          - prismlauncher-git-debug # Debugging artifacts, begone
          - ttf-meslo-nerd-font-powerlevel10k # Legacy font
          - jdk23-graalvm-ee-bin # nope
          - jdk22-graalvm-ee-bin # Yesterday's Java
          - jdk21-graalvm-ee-bin # Ancient Java (meanwhile, java 8 users...)
          - ttf-fira-code # already used, but without nerd patches
          - zed # never got used; ~/.config/zed stays deployed in case it comes back
        state: absent

    # PACKAGES - Official repos desktop packages setup
    - name: Setup desktop packages
      become: true
      notify: fonts_changed
      community.general.pacman:
        update_cache: true
        name:
          # Typography Foundation
          - ttf-roboto # The backbone of modern interfaces
          - ttf-hack # Monospace perfection
          - ttf-liberation # Freedom in letterforms
          - noto-fonts # Unicode coverage done right
          - noto-fonts-extra # Because *every* glyph matters
          - noto-fonts-emoji # Expression through pictographs
          - adobe-source-sans-fonts # Professional grade typography
          - ttf-firacode-nerd
          - ttf-jetbrains-mono-nerd
          # Core Experience
          - mpv # Video playback ascended
          - mpv-mpris # media keys and the Plasma player widget
          - yt-dlp # mpv opens URLs through it; without it a YouTube link just fails
          - realtime-privileges
          - kitty # Terminal emulation evolved
          - claude-code # Pair programming, terminal-side
          - ttf-meslo-nerd # Glyphs for the discerning eye
        state: present

    # Claude Code with ChatGPT subscription OAuth; plain `claude` stays untouched.
    - name: Create ccodex directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0700"
      loop:
        - "{{ user_home }}/.local/share/ccodex/router"
        - "{{ user_home }}/.claude-code-router"

    - name: Install ccodex subscription router
      # npm comes from arch-core. Use system Node, not a shell's older fnm version.
      environment:
        PATH: "/usr/bin:{{ ansible_facts['env'].PATH }}"
      community.general.npm:
        name: "@caeliq/claude-code-router"
        version: "2.1.15"
        path: "{{ user_home }}/.local/share/ccodex/router"
        state: present
      timeout: 180

    # Model discovery edits this file; other providers may hold keys. Seed once,
    # never overwrite it or put the OAuth token file under dotfile management.
    - name: Seed ccodex router configuration
      ansible.builtin.copy:
        src: files/ccodex-router.json
        dest: "{{ user_home }}/.claude-code-router/config.json"
        force: false
        mode: "0600"

    - name: Install ccodex launcher
      become: true
      ansible.builtin.copy:
        src: usr/local/bin/ccodex
        dest: /usr/local/bin/ccodex
        owner: root
        group: root
        mode: "0755"

    # VA-API: chrome-beta-flags already ask for hardware video decode, but without
    # a driver they're dead flags and YouTube decodes on the CPU. Intel and NVIDIA
    # need a package each (cpu_vendor / has_nvidia come from arch-core); AMD needs
    # nothing, mesa carries libva-mesa-driver. libva-utils gives `vainfo` to check.
    - name: Install VA-API drivers for the GPU at hand
      become: true
      community.general.pacman:
        name: "{{ ['libva-utils'] + (['intel-media-driver'] if cpu_vendor == 'intel' else []) + (['libva-nvidia-driver'] if (has_nvidia | bool) else []) }}"
        state: present

    # PACKAGES - AUR desktop packages setup
    - name: Install packages from AUR using yay
      kewlfft.aur.aur:
        name:
          - google-chrome-beta # Web browsing on the somewhat-bleeding edge
          - jdk24-graalvm-ee-bin # newer one
          - visual-studio-code-bin # the actual daily editor. MS build: marketplace + settings sync; extra/code is the OSS build without either
          - mpv-uosc # mpv UI; lands outside mpv's search path, mpv.conf loads it by path
          - mpv-thumbfast-git # seekbar thumbnails, uosc picks them up on its own
        use: yay
        state: present

    # CONFIG - Optimization and/or compatibility improvements
    - name: Add user to realtime group for low-latency audio
      become: true
      ansible.builtin.user:
        name: "{{ the_user }}"
        groups:
          - realtime
        append: true
    # mpv.conf includes ~~/local.conf for per-machine tuning that stays out of
    # git. mpv prints an error on every start when it's missing, so seed an
    # empty one; force: false never touches a file that's already there.
    - name: Seed empty mpv local.conf
      ansible.builtin.copy:
        content: ""
        dest: "{{ user_home }}/.config/mpv/local.conf"
        force: false
        owner: "{{ the_user }}"
        group: "{{ the_user }}"
        mode: "u+rw,g+r,o--"
    # NOTE: desktop dotfiles (kitty, mpv, zed, chrome flags) are deployed by the
    # auto-discovery task in arch-core.yml, which walks the whole user_home/ tree.
