# Overrides only; every option with docs is in /usr/share/mpv/script-opts/uosc.conf.
# Default is slang, which is unset, so the UI would fall back to English.
languages=ru,en
# Keep the timeline up instead of hiding it with the cursor: while paused, and
# always with audio, where there's no picture to keep clear. Controls too.
timeline_persistency=paused,audio
controls_persistency=audio
