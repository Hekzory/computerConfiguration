# libplacebo renderer: better scaling and tone mapping, and the only VO that
# takes the compositor's HDR target (KWin color management) into account.
vo=gpu-next

# Without a config mpv decodes on the CPU. auto-safe picks the hardware decoder
# the driver supports (nvdec on NVIDIA, vaapi on Intel and AMD) and skips the
# combos known to glitch, so 4K stops eating cores.
hwdec=auto-safe

# Deinterlace only frames flagged as interlaced (DVD rips, TV recordings),
# progressive video passes untouched. The filter follows the decoder: vavpp on
# VA-API, bwdif_cuda on nvdec, bwdif in software.
deinterlace=auto

# Built-in profile with the sharper scalers and HDR peak detection. Costs GPU
# time; a machine whose iGPU drops frames swaps the scalers in local.conf.
profile=high-quality

# Defaults keep 150 MiB ahead and 50 MiB behind, so seeking back half a
# minute in a stream downloads it again.
demuxer-max-bytes=512MiB
demuxer-max-back-bytes=256MiB

# Opening one episode queues the rest of the folder, same media type only.
# Subfolders stay out: otherwise Extras/, Fonts/ and Subs/ land in the playlist
# too, and Extras plays right after the last episode.
autocreate-playlist=same
directory-mode=ignore
# Resume where playback stopped; g-h lists what was watched, g-w what can be
# resumed (that list is empty unless watch_later files carry the file name).
# No keep-open: with it, a file watched to the end resumes on its last frame.
save-position-on-quit=yes
write-filename-in-watch-later-config=yes
save-watch-history=yes
sub-auto=fuzzy
audio-file-auto=fuzzy

# Every file opens in the same window, half the screen each way, whatever its
# resolution. No title bar: uosc draws its own, window buttons included.
autofit=50%x50%
border=no
# Quiet sources can be boosted past 100%; the stock cap is 130.
volume-max=200

# uosc (AUR mpv-uosc) installs outside mpv's search path, so load it from there.
script=/usr/share/mpv/scripts/uosc
osd-fonts-dir=/usr/share/mpv/fonts
# uosc flashes its own timeline and volume bar instead, see input.conf.
osd-bar=no

# Per-machine tuning (scalers for the GPU at hand, panel bit depth, stream
# height cap) lives outside the repo; arch-desktop seeds an empty one. Last in
# the top-level section, so it overrides everything above and stays out of the
# profiles below.
include=~~/local.conf

# Streams up to 1080p is where banding shows up, and there deband costs under 1 ms.
[stream-deband]
profile-cond=demuxer_via_network and height and height <= 1080
profile-restore=copy
deband=yes
