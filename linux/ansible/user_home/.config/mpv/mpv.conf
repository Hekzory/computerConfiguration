# Without a config mpv decodes on the CPU and renders with the older vo.
# auto-safe picks the hardware decoder the driver supports (nvdec on NVIDIA,
# vaapi on Intel) and skips the combos known to glitch, so 4K stops eating cores.
hwdec=auto-safe

# libplacebo renderer: better scaling and tone-mapping, HDR passthrough.
vo=gpu-next

# Built-in profile with the sharper scalers. Costs GPU time; drop it if an iGPU
# stutters on 4K.
profile=high-quality
