# Right click opens the uosc menu instead of toggling pause.
MBTN_RIGHT script-binding uosc/menu-blurred
MENU       script-binding uosc/menu

# Stock seek and volume keys, plus a flash of the matching uosc element:
# with osd-bar=no nothing else shows where playback went.
RIGHT       seek  5;  script-binding uosc/flash-timeline
LEFT        seek -5;  script-binding uosc/flash-timeline
UP          seek  60; script-binding uosc/flash-timeline
DOWN        seek -60; script-binding uosc/flash-timeline
WHEEL_RIGHT seek  10; script-binding uosc/flash-timeline
WHEEL_LEFT  seek -10; script-binding uosc/flash-timeline
WHEEL_UP    add volume  2; script-binding uosc/flash-volume
WHEEL_DOWN  add volume -2; script-binding uosc/flash-volume
0           add volume  2; script-binding uosc/flash-volume
9           add volume -2; script-binding uosc/flash-volume
*           add volume  2; script-binding uosc/flash-volume
/           add volume -2; script-binding uosc/flash-volume
m           cycle mute;    script-binding uosc/flash-volume
