[defaults]
interpreter_python=auto_silent
gathering=smart
# facts only via ansible_facts['...'], never as top-level ansible_* vars: the
# injection is deprecated (gone in 2.24) and off here so a slip fails instead of warning
inject_facts_as_vars=False
inventory=/etc/ansible/hosts
retry_files_enabled=false
forks=20
callback_whitelist=timer, profile_tasks
host_key_checking=false
strategy=free
fact_caching = jsonfile
fact_caching_connection = /tmp/ansible_facts
fact_caching_timeout = 3600


[privilege_escalation]

[persistent_connection]

[connection]

[colors]
highlight = white
verbose = blue
warn = bright purple
error = red
debug = dark gray
deprecate = purple
skip = cyan
unreachable = red
ok = green
changed = yellow
diff_add = green
diff_remove = red
diff_lines = cyan

[selinux]

[diff]
always=true

[galaxy]

[inventory]

[netconf_connection]

[paramiko_connection]

[jinja2]

[tags]

