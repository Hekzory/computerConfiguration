# Explicitly invoked only; never imported by arch-core, arch-desktop or arch-home.
- name: Configure opt-in corporate Codex integrations
  hosts: arch
  become: false
  vars:
    the_user: "{{ ansible_facts['user_id'] }}"
    user_home: "{{ ansible_facts['env'].HOME }}"
    is_wsl: "{{ 'microsoft' in (ansible_facts['kernel'] | lower) }}"
  roles:
    - role: codex
      become: true
      tags: [codex]
    - role: codex_corporate
      become: true
      tags: [codex_corporate]
