name: Ansible Quality Gates
on:
  push:
    branches: ["main", "master"]
    paths:
      - 'linux/ansible/**'
      - 'windows/**'
      - '.github/workflows/**'
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Ansible Lint
    # The self-hosted runner named by the repo variable CI_RUNNER takes the
    # owner's and Dependabot's own branches; everything else, pull requests
    # from forks included, runs on GitHub's runners, and so does every job
    # while CI_RUNNER is unset.
    runs-on: ${{ (github.actor == github.repository_owner || github.actor == 'dependabot[bot]') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Add fake .git dir
        run: mkdir -p "${{ github.workspace }}/linux/ansible/.git"
      - name: Run ansible-lint
        uses: ansible/ansible-lint@v26.10.1
        with:
          working_directory: "${{ github.workspace }}/linux/ansible"

  # The dotfiles ship to every machine on the next run; a typo in them used to
  # get caught by the machines. shellcheck comes with the runner image.
  static:
    name: Shell, fish, Lua, Python checks
    # The self-hosted runner named by the repo variable CI_RUNNER takes the
    # owner's and Dependabot's own branches; everything else, pull requests
    # from forks included, runs on GitHub's runners, and so does every job
    # while CI_RUNNER is unset.
    runs-on: ${{ (github.actor == github.repository_owner || github.actor == 'dependabot[bot]') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.CI_RUNNER || 'ubuntu-latest' }}
    # An apt hang once ran into GitHub's 6 h limit.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck the helper scripts
        run: |
          shellcheck \
            linux/ansible/run.sh \
            linux/ansible/user_home/.claude/statusline.sh \
            linux/ansible/user_home/.claude/otel-headers.sh \
            linux/ansible/user_home/.claude/hooks/git-guard.sh
      - name: Test Python helpers without an account or network
        working-directory: linux/ansible
        run: timeout 30s python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Install fish 4 (same major as the machines, ubuntu ships 3.x)
        # o-srv's runner image has it from the same PPA; GitHub's runners don't
        run: |
          if ! fish --version 2>/dev/null | grep -q 'version 4\.'; then
            sudo add-apt-repository -y ppa:fish-shell/release-4
            sudo apt-get update
            sudo apt-get install -y fish
          fi
          fish --version
      - name: fish -n on every shipped fish file
        run: find linux/ansible/user_home/.config/fish -name '*.fish' -print0 | xargs -0 -n1 -t fish -n
      - name: stylua --check init.lua
        uses: JohnnyMorganz/stylua-action@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: v2.5.2
          args: --check linux/ansible/user_home/.config/nvim/init.lua
