name: Claude Code checks
on:
  push:
    branches: ["main", "master"]
    paths:
      - 'linux/ansible/roles/claude/**'
      - 'linux/ansible/files/ssh-fish-guard.py'
      - '.github/workflows/claude-mods.yml'
  pull_request:
    branches: ["main", "master"]
    paths:
      - 'linux/ansible/roles/claude/**'
      - 'linux/ansible/files/ssh-fish-guard.py'
      - '.github/workflows/claude-mods.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static:
    name: Claude static checks
    runs-on: ${{ (github.actor == github.repository_owner || github.actor == 'dependabot[bot]') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    defaults:
      run:
        working-directory: linux/ansible/roles/claude
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Check shell helpers
        run: find files/user_home -name '*.sh' -print0 | xargs -0 shellcheck
      - name: Check JavaScript syntax
        run: find files/mods -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -n1 node --check
      - name: Check Python and JSON files
        run: |
          python3 -m compileall -q files tests
          python3 -m py_compile files/ccodex
          python3 - <<'PY'
          import json
          from pathlib import Path
          for file in Path('files').rglob('*.json'):
              json.loads(file.read_text())
          PY
      - name: Test ccodex without a Claude installation or account
        run: timeout 30s python3 -m unittest discover -s tests -p 'test_*.py' -v
